<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Riesgo Beneficio</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

.resultado{
    margin-top:20px;
    background:#f0fdf4;
    padding:15px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 Calculadora Riesgo / Beneficio</h1>

<label>Capital de la cuenta</label>
<input type="number" id="capital" value="10000">

<label>Riesgo (%)</label>
<input type="number" id="riesgo" value="1">

<label>Precio de entrada</label>
<input type="number" id="entrada" value="100">

<label>Stop Loss</label>
<input type="number" id="stop" value="95">

<label>Take Profit</label>
<input type="number" id="tp" value="115">

<button onclick="calcularTrading()">Calcular</button>

<div id="resultado" class="resultado" style="display:none;">

<p><strong>Dinero arriesgado:</strong>
$<span id="riesgoDinero"></span></p>

<p><strong>Tamaño de posición:</strong>
<span id="cantidad"></span></p>

<p><strong>Ganancia potencial:</strong>
$<span id="ganancia"></span></p>

<p><strong>Ratio Riesgo / Beneficio:</strong>
<span id="ratio"></span></p>

</div>

</div>

<script>

function calcularTrading(){

    let capital =
        parseFloat(document.getElementById("capital").value);

    let riesgo =
        parseFloat(document.getElementById("riesgo").value);

    let entrada =
        parseFloat(document.getElementById("entrada").value);

    let stop =
        parseFloat(document.getElementById("stop").value);

    let tp =
        parseFloat(document.getElementById("tp").value);

    let riesgoDinero =
        capital * (riesgo / 100);

    let riesgoUnidad =
        Math.abs(entrada - stop);

    let cantidad =
        riesgoDinero / riesgoUnidad;

    let gananciaUnidad =
        Math.abs(tp - entrada);

    let ganancia =
        cantidad * gananciaUnidad;

    let ratio =
        gananciaUnidad / riesgoUnidad;

    document.getElementById("riesgoDinero").innerText =
        riesgoDinero.toFixed(2);

    document.getElementById("cantidad").innerText =
        cantidad.toFixed(2);

    document.getElementById("ganancia").innerText =
        ganancia.toFixed(2);

    document.getElementById("ratio").innerText =
        "1 : " + ratio.toFixed(2);

    document.getElementById("resultado").style.display="block";
}

</script>

</body>
</html>
